#
# Values for the soak harness's Kubernetes target. A deliberately
# small cluster-shaped deployment: the point is to exercise what the
# chart adds - probes, StatefulSet replacement, the PKI bootstrap Job
# - not to reproduce production's sizing. NetworkPolicies are
# rendered and applied but not enforced here; see below.
#
# Anything that would reach outside the cluster is off. The bridge's
# external LoadBalancer needs a cloud controller and external-dns
# needs a zone; neither exists in kind, and neither is what this
# target is here to test.

images:
  bridge:
    repository: sigul-bridge
    tag: soak
    digest: ""
    pullPolicy: Never
  server:
    repository: sigul-server
    tag: soak
    digest: ""
    pullPolicy: Never
  client:
    repository: sigul-client
    tag: soak
    digest: ""
    pullPolicy: Never

# The load generator's home. The harness runs outside the cluster and
# sends every request through this pod, which is the one place a
# provisioned client already exists - so nothing has to be installed
# to make the release measurable.
adminToolbox:
  enabled: true

bridge:
  service:
    external:
      enabled: false

pki:
  externalFQDN: sigul-bridge.soak.test

server:
  persistence:
    size: 1Gi
    # Empty means the cluster's default class, which kind provides
    # through its local-path provisioner.
    storageClassName: ""
    volumePermissions:
      enabled: false

storageClass:
  create: false

# Applied, but not yet verified. kind's default CNI (kindnet)
# accepts NetworkPolicy objects and does not enforce them, so these
# exercise the chart's templating and the apiserver's validation and
# nothing more. Enforcing them needs the cluster created with
# disableDefaultCNI and a policy-capable CNI installed, plus a
# negative connectivity assertion to prove the enforcement is real -
# worth doing, and tracked as issue #26. Left on so the policies are
# at least rendered and applied exactly as production has them.
networkPolicy:
  enabled: true
