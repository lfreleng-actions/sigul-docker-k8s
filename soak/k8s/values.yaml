#
# Values for the soak harness's Kubernetes target. A deliberately
# small cluster-shaped deployment: the point is to exercise what the
# chart adds - probes, StatefulSet replacement, the PKI bootstrap Job,
# NetworkPolicies - not to reproduce production's sizing.
#
# Anything that would reach outside the cluster is off. The bridge's
# external LoadBalancer needs a cloud controller and external-dns
# needs a zone; neither exists in kind, and neither is what this
# target is here to test.

images:
  bridge:
    repository: sigul-bridge
    tag: soak
    digest: ""
    pullPolicy: Never
  server:
    repository: sigul-server
    tag: soak
    digest: ""
    pullPolicy: Never
  client:
    repository: sigul-client
    tag: soak
    digest: ""
    pullPolicy: Never

# The load generator's home. The harness runs outside the cluster and
# sends every request through this pod, which is the one place a
# provisioned client already exists - so nothing has to be installed
# to make the release measurable.
adminToolbox:
  enabled: true

bridge:
  service:
    external:
      enabled: false

pki:
  externalFQDN: sigul-bridge.soak.test

server:
  persistence:
    size: 1Gi
    # Empty means the cluster's default class, which kind provides
    # through its local-path provisioner.
    storageClassName: ""
    volumePermissions:
      enabled: false

storageClass:
  create: false

# Enforced, and checked on every deploy. kind's CNI (kindnet) enforces
# NetworkPolicy - measured: an outside pod reaches the server-only
# bridge port only once every policy that covers it has been removed.
# deploy.sh proves each run that the policies still say what they
# should, with a negative check paired to a control for every rule,
# and stops before any soak if they do not.
networkPolicy:
  enabled: true
