---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

ci:
  autofix_prs: false
  # pre-commit.ci sandbox prevents network calls; disable gha-workflow-linter.
  # aislop also runs engines that can call the network at scan time
  # (dependency audits), so it cannot run in the sandbox either.
  # basedpyright needs the typing modules of the packages the code
  # imports, and any additional_dependencies exceed pre-commit.ci's
  # 250 MiB per-hook limit (the bare hook alone is 248.7 MiB).
  skip: [gha-workflow-linter, aislop, basedpyright]
  autofix_commit_msg: |
    Chore: pre-commit autofixes

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci@users.noreply.github.com>
  autoupdate_commit_msg: |
    Chore: pre-commit autoupdate

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci@users.noreply.github.com>

exclude: "^docs/conf.py"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-ast
      - id: check-json
        # Zed's settings.json is JSONC: comments are permitted (as in
        # VS Code), and the strict JSON parser cannot read them.
        exclude: ^\.zed/
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
        # Helm templates are Go-templated, not valid YAML;
        # 'helm lint' validates them instead.
        exclude: ^K8S/charts/[^/]+/templates/
      - id: debug-statements
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args:
          - --branch=dev
          - --branch=master
          - --branch=main
          - --branch=rc
          - --branch=production

  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98 # frozen: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        types: [yaml]
        # Helm templates are Go-templated, not valid YAML;
        # 'helm lint' validates them instead.
        exclude: ^K8S/charts/[^/]+/templates/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e  # frozen: v0.17.0
    hooks:
      # No 'files' filter: the hook's own types:[python] selector is
      # the correct scope. A path allowlist inherited from a template
      # (scripts|tests|custom_components) silently excluded
      # build-scripts/ and K8S/, so Python added there was never
      # linted or formatted in CI while editors still flagged it.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b  # frozen: v2.4.0
    hooks:
      - id: mypy

  - repo: https://github.com/btford/write-good
    rev: ab66ce10136dfad5146e69e70f82a3efac8842c1 # frozen: v1.0.8
    hooks:
      - id: write-good
        files: "\\.(rst|md|markdown|mdown|mkdn)$"
        exclude:
          "^(docs/|K8S/docs/|DEPLOYMENT_GUIDE\\.md|OPERATIONS_GUIDE\\.md|README\\.md|baseline-paths\\.md|patches/README\\.md|soak/README\\.md|K8S/charts/sigul/README\\.md)"

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # Dockerfile linter. AleksaC/hadolint-py vendors the hadolint binary
  # via pip so the hook works on pre-commit.ci (no Docker required).
  # Configuration lives in .hadolint.yaml at the repo root.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb  # frozen: v2.15.1
    hooks:
      - id: hadolint
        files: '(?i)(^|/)Dockerfile($|\.)'

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--fix"]
        exclude:
          "^(docs/|K8S/docs/|OPERATIONS_GUIDE\\.md|baseline-paths\\.md)"

  - repo: https://github.com/fsfe/reuse-tool
    rev: 9fabf9eb815a57aac116b435e8346c200cdb8604  # frozen: v6.2.0
    hooks:
      - id: reuse

  # Replaces: https://github.com/rhysd/actionlint
  # Permits actionlint to run both locally and with precommit.ci/GitHub
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 357f7eec6dec49bf7693dc0dbec30212226d5492  # frozen: v1.7.12.25
    hooks:
      - id: actionlint

  # Check for misspellings in documentation files
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        exclude: |
          (?x)^(
            pki/.*\.asc
          | test/fixtures/regenerate-import-test-key\.sh
          | scripts/run-signing-tests\.sh
          )$

  # Requires a mirror, primary repo lacks .pre-commit-hooks.yaml
  - repo: https://github.com/DetachHead/basedpyright-prek-mirror
    rev: a11caebebdbf797e1e96611123db279b334a7675  # frozen: 1.40.2
    hooks:
      - id: basedpyright
        # Configured in pyrightconfig.json, not pyproject.toml: aislop
        # treats any root pyproject.toml as a Python manifest and then
        # flags undeclared imports (passlib, crypt) in build-scripts/,
        # and this repository declares no Python project to list them.
        # That file stays plain JSON, because the check-json hook validates
        # it strictly (basedpyright itself would accept comments), so its
        # settings are explained here:
        # - pythonVersion 3.12: the oldest interpreter that runs checked
        #   code, the ubuntu-latest (24.04) system python3 that runs
        #   soak/harness in soak-nightly and pin-chart-images.py in
        #   release.
        # - typeCheckingMode "all": stricter than the org's "standard";
        #   kept from the previous configuration.
        # - include: the same directories as the args below. tests/ and
        #   scripts/ hold only shell; test/fixtures/ holds no Python.
        # - executionEnvironments: each root is also the import root for
        #   its files (the chart scripts import their siblings; the
        #   harness runs as `python -m harness` from soak/). Chart
        #   scripts, crypt_compat.py and test/ run only inside the
        #   Fedora 44 images, so are checked at Python 3.14.
        # - reportMissingImports off for test/ only: those scripts run
        #   inside the images and import Sigul's own modules (not on
        #   PyPI) and python-nss-ng (Linux manylinux_2_38 wheels only,
        #   so no hook environment can install it on macOS).
        # Analyse the whole scope, not just the staged files: a change
        # in one file can introduce a diagnostic in an unchanged one.
        pass_filenames: false
        # Run even when no Python file is staged (deletions, config).
        always_run: true
        # Keep always_run from also firing at commit-msg.
        stages: [pre-commit]
        args:
          # Fail on warnings as well as errors.
          - --warnings
          # The same directories as `include` in pyrightconfig.json.
          - K8S/charts/sigul/files/scripts
          - build-scripts
          - soak
          - test
        # Packages the checked code imports, plus their typing stubs,
        # so every import outside test/ resolves.  Each pin is the
        # version that runs that code, so the hook checks the real API:
        # - docker, locust, matplotlib: soak/requirements.txt, which the
        #   soak image and soak-nightly's host venv install.
        # - passlib: the images' `pip3 install passlib==1.7.4`.
        # - requests: the Fedora 44 python3-requests RPM the images
        #   install (2.33.1).  It ships no inline types; 2.34 does.
        # - types-*: the stubs release for that same API (typeshed:
        #   requests ~=2.33.0, docker 7.2.*, passlib 1.7.*).  The
        #   passlib stubs are final; typeshed has removed them.
        # Bump each pin with its runtime, not on its own.
        additional_dependencies:
          - docker==7.2.0
          - locust==2.46.5
          - matplotlib==3.11.2
          - passlib==1.7.4
          - requests==2.33.1
          - types-docker==7.2.0.20260923
          - types-passlib==1.7.7.20260211
          - types-requests==2.33.0.20260906

  - repo: https://github.com/lfreleng-actions/gha-workflow-linter
    rev: 8fa42d5748a293016a8d467618f3e7ee7eac9c3a  # frozen: v1.8.1
    hooks:
      - id: gha-workflow-linter

  # Catch AI slop developer-side before it reaches a pull request.
  # Runs the full-repository quality gate, scored against
  # .aislop/config.yml. A local hook installing the published npm
  # package: the scanaislop/aislop git repository does not ship the
  # built dist/, so its bundled pre-commit hook cannot install. Bump
  # the pinned version here manually when new aislop releases ship.
  - repo: local
    hooks:
      - id: aislop
        name: aislop
        entry: aislop ci --human
        language: node
        additional_dependencies: ["aislop@0.13.1"]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
    hooks:
      - id: check-github-actions
      - id: check-github-workflows
      - id: check-jsonschema
        name: Check GitHub Workflows set timeout-minutes
        args:
          - --builtin-schema
          - github-workflows-require-timeout
        files: ^\.github/workflows/[^/]+$
        types:
          - yaml
      - id: check-readthedocs
