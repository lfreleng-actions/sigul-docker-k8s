#
# Mutual exclusion for the PKI bootstrap Job.
#
# The Job name is revisioned, so plain Helm can have two bootstrap Jobs
# alive at once (a second `helm upgrade` issued before the first Job
# finished). Both would generate independently and interleave writes to
# the CA, P12 and password Secrets, producing a mixed trust domain that
# the loser then marks complete. Per-Secret resourceVersion checks
# cannot prevent that: each writer legitimately reads the latest version
# before patching.
#
# This Lease is the compare-and-set point. Acquisition is a single
# conditional patch carrying the observed resourceVersion, so exactly
# one runner wins; the loser fails fast and its Job backoff retries once
# the holder has finished. Pre-created here (empty) for the same reason
# as the Secrets: the Job's Role can then omit the unrestrictable
# "create" verb.
#
# The lease duration is the safety net for a runner killed without
# releasing (OOM, node loss). Job.activeDeadlineSeconds, plus the
# pod's termination grace period, is bounded below it so a run can
# never outlive its own lease (see templates/pki-bootstrap-job.yaml,
# which validates that relationship at render time).
#
# Seeded here and re-asserted by the holder on every acquisition
# (k8s_api.acquire_lease patches it from pki.lockLeaseDurationSeconds).
#
# OPERATIONAL CAVEAT: because Helm manages this field, an upgrade
# that LOWERS pki.lockLeaseDurationSeconds patches it on a Lease a
# previous revision's Job may still be holding, shortening that
# holder's expiry underneath it. A retrying revision could then
# acquire the lock while the first runner is still writing the PKI
# Secrets, producing exactly the mixed trust domain this object
# prevents. Raising the value is always safe; lower it only when no
# bootstrap Job is running (check for a pki-bootstrap pod first).
#
# Leaving the field unmanaged instead does not fix this: the removal
# is itself a patch that lands on the held Lease, and a runner then
# has no recorded duration to judge - any substituted value is either
# too short (declares a live holder dead) or, if a ceiling is
# assumed, unbounded above by pki.lockLeaseDurationSeconds and so no
# safer. Keeping the field and bounding when it may be lowered is the
# honest trade.
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ include "sigul.lease.bootstrapLock" . }}
  labels:
    {{- include "sigul.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  leaseDurationSeconds: {{ .Values.pki.lockLeaseDurationSeconds }}
