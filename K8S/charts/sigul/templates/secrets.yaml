#
# Pre-created (empty) Secrets, populated by the PKI bootstrap Job.
#
# Creating them here lets the Job's Role drop the unrestrictable
# "create" verb entirely - it holds only get/update on these exact
# names, so a compromised bootstrap pod cannot mint arbitrary Secrets.
#
# The Job distinguishes "exists but empty" from "populated": empty
# data means not yet bootstrapped. Plain-Helm upgrades never touch
# the populated data (three-way merge sees no manifest change); for
# Argo CD, the example Application ignores Secret /data differences.
#
# resource-policy keep: uninstalling the release must never delete
# the trust domain or admin credential.
{{- range $name := list
    (include "sigul.secret.caPublic" .)
    (include "sigul.secret.bridgeP12" .)
    (include "sigul.secret.serverP12" .)
    (include "sigul.secret.clientP12" .)
    (include "sigul.secret.passwords" .)
    (include "sigul.secret.admin" .)
    (include "sigul.secret.marker" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sigul.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Deletion protection on BOTH management planes: resource-policy
    # covers Helm; sync-options covers Argo CD prune/cascade delete.
    # Losing these Secrets (especially the admin credential, whose
    # hash persists in the server database) is unrecoverable without
    # backups.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
{{- end }}
