#
# PKI bootstrap: generates the tenant's private CA + component certs
# with certutil (preserving Sigul's established PKI mechanics) and
# publishes them as Secrets.
#
# Ordering differs by management plane. Under Argo CD this is a Sync
# hook at wave -1, so it completes before the workloads are created.
# Under plain Helm it is a normal (revisioned) Job applied alongside
# them - it is deliberately NOT a Helm hook, because a hook would have
# to drag its ConfigMap, RBAC and pre-created Secrets into the hook
# lifecycle too. The script compensates: it records the restart
# obligation before publishing, so a run interrupted after workloads
# have consumed its output is recovered with a coordinated restart.
{{- /*
  Termination budget for the bootstrap pod, derived in one place so
  the two halves cannot drift apart.

  Two constraints have to hold at once:

    * the grace period must outlast the longest foreground command,
      or the scratch-scrubbing EXIT trap in pki-bootstrap.sh never
      runs and a SIGKILL leaves the CA private key in /work;
    * the whole run - deadline plus grace - must finish before the
      lock Lease expires, or a terminating runner outlives its own
      lock and a second one starts writing the PKI Secrets
      concurrently, producing a mixed trust domain.

  lockLeaseDurationSeconds is user-settable with no lower bound, so
  a short lease can satisfy the first and break the second. Reject
  that at render time rather than letting it become a race in a
  cluster.
*/}}
{{- $graceSeconds := 160 }}
{{- $leaseSeconds := int .Values.pki.lockLeaseDurationSeconds }}
{{- $deadlineSeconds := mul (div $leaseSeconds 3) 2 }}
{{- /* Positivity applies to every mode: templates/lease.yaml renders
       this value into the Lease unconditionally, and the API rejects
       a non-positive leaseDurationSeconds. Catching it here beats
       rendering cleanly and failing at admission. */}}
{{- if le $leaseSeconds 0 }}
{{- fail (printf "pki.lockLeaseDurationSeconds must be greater than zero (got %d). templates/lease.yaml renders it into the Lease, and the Kubernetes API rejects a non-positive leaseDurationSeconds." $leaseSeconds) }}
{{- end }}
{{- /* The timing invariant, by contrast, is mode-specific: only auto
       and force take the lock; skip exits before acquiring it
       (pki-bootstrap.sh), so a short duration must not block
       rendering there. */}}
{{- if and (ne .Values.pki.mode "skip") (ge (add $deadlineSeconds $graceSeconds) $leaseSeconds) }}
{{- fail (printf "pki.lockLeaseDurationSeconds is %d, which is too short: the bootstrap Job's activeDeadlineSeconds (%d) plus its terminationGracePeriodSeconds (%d) reach %d, at or past the lease expiry. A terminating runner could then outlive its own lock and race a second one onto the PKI Secrets. Use at least 600." $leaseSeconds $deadlineSeconds $graceSeconds (add $deadlineSeconds $graceSeconds)) }}
{{- end }}
{{- if .Values.serviceAccounts.pkiBootstrap.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sigul.fullname" . }}-pki-bootstrap
  labels:
    {{- include "sigul.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
# Make the token opt-in rather than automatic. The bootstrap Job below
# asks for it explicitly; anything else that names this account - a
# debug pod, a copied manifest - gets no credential by default.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sigul.fullname" . }}-pki-bootstrap
  labels:
    {{- include "sigul.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # The Secrets are pre-created (empty) by the chart (secrets.yaml),
  # so no "create" verb is needed - create cannot be constrained by
  # resourceNames and would let this token mint arbitrary Secrets.
  # The Job writes /data via merge-patch only (metadata stays owned
  # by the chart's field manager).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames:
      - {{ include "sigul.secret.caPublic" . }}
      - {{ include "sigul.secret.bridgeP12" . }}
      - {{ include "sigul.secret.serverP12" . }}
      - {{ include "sigul.secret.clientP12" . }}
      - {{ include "sigul.secret.passwords" . }}
      - {{ include "sigul.secret.admin" . }}
      - {{ include "sigul.secret.marker" . }}
  # Mutual exclusion between concurrent bootstrap runners. Pre-created
  # by the chart (templates/lease.yaml) so "create" stays out of this
  # Role, exactly as for the Secrets.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "patch"]
    resourceNames:
      - {{ include "sigul.lease.bootstrapLock" . }}
  {{- if .Values.pki.forceRestartWorkloads }}
  # OPT-IN (pki.forceRestartWorkloads): force-mode regeneration
  # triggers a coordinated rolling restart. Note patch on a workload
  # is pod-template modification power - keep disabled unless the
  # convenience outweighs least-privilege for this token (default
  # path: operator performs the rollout manually, see README).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames:
      - {{ include "sigul.bridge.deploymentName" . }}
      - {{ include "sigul.toolbox.deploymentName" . }}
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "patch"]
    resourceNames:
      - {{ include "sigul.server.statefulSetName" . }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sigul.fullname" . }}-pki-bootstrap
  labels:
    {{- include "sigul.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: {{ include "sigul.pkiBootstrap.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "sigul.fullname" . }}-pki-bootstrap
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # Revisioned name: Job pod templates are immutable, and with plain
  # Helm a completed Job can linger (ttlSecondsAfterFinished) across
  # an upgrade - patching it would fail. A per-revision name sidesteps
  # that; under Argo CD the hook-delete-policy recreates it anyway
  # (Argo renders with a constant revision).
  name: {{ include "sigul.fullname" . }}-pki-bootstrap-r{{ .Release.Revision }}
  labels:
    {{- include "sigul.labels" . | nindent 4 }}
    app.kubernetes.io/component: pki-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  {{- if ne .Values.pki.mode "skip" }}
  # Bounded below the lock lease duration so a run can never outlive
  # the lease it holds (which would let a second runner acquire the
  # lock while the first is still writing). The termination grace
  # period counts towards that too - see the budget at the top of
  # this file.
  #
  # Omitted for mode=skip: that run exits before taking the lock, so
  # there is no lease to stay inside, and deriving a deadline from an
  # unused duration only creates ways to fail - a duration below 3
  # floors to 0, which the Job API rejects outright, and a small one
  # could kill the no-op pod before it starts.
  activeDeadlineSeconds: {{ $deadlineSeconds }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "sigul.labels" . | nindent 8 }}
        app.kubernetes.io/component: pki-bootstrap
    spec:
      {{- include "sigul.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "sigul.pkiBootstrap.serviceAccountName" . }}
      # Explicit, and the one pod in this chart that needs a token:
      # in auto and force modes the script talks to the API server
      # directly (files/scripts/k8s_api.py reads the projected token)
      # to patch the PKI Secrets and hold the bootstrap Lease.
      # Setting it here rather than relying on the cluster default
      # keeps the requirement visible and survives a ServiceAccount
      # that disables automounting.
      #
      # False for mode=skip: that run exits before its first API
      # call, so mounting a credential it cannot use is pure
      # attack surface.
      #
      # With serviceAccounts.pkiBootstrap.create=true (the default)
      # the chart owns the account and its RBAC: automounting is off
      # on the ServiceAccount, so this line is the only thing that
      # grants a token. The bound Role is get/patch on the named
      # Secrets plus the one Lease - and, when
      # pki.forceRestartWorkloads is enabled, get/patch on the named
      # Deployments and StatefulSet as well. That last grant is
      # pod-template modification power on this release's workloads,
      # so the token this line mounts is materially more capable
      # under that option than under the default.
      #
      # With create=false the chart owns neither. The caller's
      # account supplies whatever RBAC it already carries, and this
      # line opts that credential into the pod. Grant it no more than
      # the Role above defines for the options in use - the workload
      # verbs only if forceRestartWorkloads is on - and disable
      # automounting on the account itself so nothing else inherits
      # it.
      #
      # Either way the pod is short-lived: the Job runs once, its
      # scratch material lives in a memory-backed emptyDir, and
      # pki-bootstrap.sh scrubs that scratch on exit, including on
      # failure and on SIGTERM, so a failed run does not leave the CA
      # private key sitting in the pod until the Job's TTL expires.
      # A SIGKILL (OOM, grace-period expiry) cannot be trapped, so
      # the key can outlive that one case, until the pod object is
      # removed. It stays in tmpfs rather than the container
      # filesystem - though tmpfs pages can be swapped, so a strict
      # never-on-disk guarantee also needs swap disabled on the
      # nodes (or a noswap tmpfs).
      automountServiceAccountToken: {{ ne .Values.pki.mode "skip" }}
      restartPolicy: Never
      # Sized so the EXIT trap in pki-bootstrap.sh completes on a
      # SIGTERM. Bash defers a trapped signal until the current
      # foreground command returns, and the trap then runs a second
      # bounded command of its own, so the budget is:
      #
      #   70s  in-flight publish-secrets call (capped by `timeout`)
      # +  0s  scrub_scratch (local rm)
      # + 70s  release_lock, another publish-secrets call
      # + 20s  margin
      #   ----
      #   160s
      #
      # Dropping the lock release from this budget would be the
      # expensive mistake: a SIGKILL there leaves the Lease held for
      # its full duration, and the replacement Job cannot acquire it.
      terminationGracePeriodSeconds: {{ $graceSeconds }}
      securityContext:
        {{- include "sigul.podSecurityContext" . | nindent 8 }}
      containers:
        - name: pki-bootstrap
          image: {{ include "sigul.image.bridge" . }}
          imagePullPolicy: {{ .Values.images.bridge.pullPolicy }}
          command: ["/bin/bash", "/scripts/pki-bootstrap.sh"]
          securityContext:
            {{- include "sigul.containerSecurityContext" . | nindent 12 }}
          env:
            - name: PKI_MODE
              value: {{ .Values.pki.mode | quote }}
            - name: EXTERNAL_FQDN
              value: {{ .Values.pki.externalFQDN | quote }}
            - name: INTERNAL_FQDN
              value: {{ include "sigul.bridge.internalFQDN" . | quote }}
            - name: BRIDGE_SERVICE_NAME
              value: {{ include "sigul.bridge.serviceName" . | quote }}
            - name: CA_VALIDITY_MONTHS
              value: {{ .Values.pki.caValidityMonths | quote }}
            - name: CERT_VALIDITY_MONTHS
              value: {{ .Values.pki.certValidityMonths | quote }}
            - name: SECRET_CA_PUBLIC
              value: {{ include "sigul.secret.caPublic" . | quote }}
            - name: SECRET_BRIDGE_P12
              value: {{ include "sigul.secret.bridgeP12" . | quote }}
            - name: SECRET_SERVER_P12
              value: {{ include "sigul.secret.serverP12" . | quote }}
            - name: SECRET_CLIENT_P12
              value: {{ include "sigul.secret.clientP12" . | quote }}
            - name: SECRET_PASSWORDS
              value: {{ include "sigul.secret.passwords" . | quote }}
            - name: SECRET_ADMIN
              value: {{ include "sigul.secret.admin" . | quote }}
            - name: SECRET_MARKER
              value: {{ include "sigul.secret.marker" . | quote }}
            - name: LOCK_LEASE
              value: {{ include "sigul.lease.bootstrapLock" . | quote }}
            - name: LOCK_DURATION_SECONDS
              value: {{ .Values.pki.lockLeaseDurationSeconds | quote }}
            # Lock holder identity: unique per pod, so a retry can tell
            # its own stale lease from a live competitor's.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.pki.forceRestartWorkloads }}
            - name: BRIDGE_DEPLOYMENT
              value: {{ include "sigul.bridge.deploymentName" . | quote }}
            - name: SERVER_STATEFULSET
              value: {{ include "sigul.server.statefulSetName" . | quote }}
            {{- if .Values.adminToolbox.enabled }}
            - name: ADMIN_TOOLBOX_DEPLOYMENT
              value: {{ include "sigul.toolbox.deploymentName" . | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: {{ include "sigul.fullname" . }}-scripts
            defaultMode: 0555
        - name: work
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
